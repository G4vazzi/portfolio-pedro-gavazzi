
name: Atualizar platinas PSN

on:
  workflow_dispatch:

  schedule:
    # 07:17 e 19:17 - horario de Brasilia
    - cron: "17 10,22 * * *"

permissions:
  contents: write

concurrency:
  group: psn-trophies-sync
  cancel-in-progress: false

jobs:
  sincronizar:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          package-manager-cache: false

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar trofeus PlayStation
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
        run: node scripts/sync-psn.mjs

      - name: Atualizar JSON no GitHub
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/psn-trophies.json

          if git diff --cached --quiet; then
            echo "Nenhuma alteracao encontrada."
          else
            git commit -m "Atualiza platinas PlayStation"
            git push
          fi
