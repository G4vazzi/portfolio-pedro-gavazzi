name: Atualizar Trofeus PSN

on:
  workflow_dispatch:
  schedule:
    - cron: "23 */12 * * *"

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Sincronizar PlayStation
        run: node scripts/sync-psn.mjs
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          PSN_ONLINE_ID: ${{ vars.PSN_ONLINE_ID }}
          PSN_PROFILE_URL: ${{ vars.PSN_PROFILE_URL }}

      - name: Publicar JSON atualizado
        run: |
          git add data/psn-trophies.json
          if git diff --cached --quiet; then exit 0; fi
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -m "Atualizar trofeus PSN"
          git push