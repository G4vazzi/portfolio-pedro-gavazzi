name: Publicar PG Reality

on:
  push:
    branches:
      - main

  workflow_dispatch:

  schedule:
    - cron: "17 10,22 * * *"

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Baixar projeto
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Instalar dependencias
        run: npm ci

      - name: Gerar dados PlayStation e Steam
        env:
          PSN_NPSSO: ${{ secrets.PSN_NPSSO }}
          STEAM_ID: ${{ secrets.STEAM_ID }}
          STEAM_API_KEY: ${{ secrets.STEAM_API_KEY }}
        run: |
          node scripts/sync-psn.mjs > /dev/null
          node scripts/sync-psn-library.mjs > /dev/null
          node scripts/sync-steam-library.mjs > /dev/null
          echo "Dados gerados para publicacao."

      - name: Preparar arquivos do site
        run: |
          mkdir -p public
          rsync -a ./ public/ \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='node_modules/' \
            --exclude='scripts/' \
            --exclude='img/futebol/' \
            --exclude='.env*' \
            --exclude='package*.json' \
            --exclude='.gitignore' \
            --exclude='public/'

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Enviar arquivos para publicacao
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./public

  deploy:
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Publicar site
        id: deployment
        uses: actions/deploy-pages@v4